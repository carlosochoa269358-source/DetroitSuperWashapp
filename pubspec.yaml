name: detroit_super_wash
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Supabase
  supabase_flutter: ^2.8.4
  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.2
  # Navigation
  go_router: ^15.1.1
  # Utils
  shared_preferences: ^2.3.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.20.2
  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  # Image
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
